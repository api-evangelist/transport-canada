finding: >-
  Transport Canada publishes NO client libraries. There is no first-party SDK
  on npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist or
  crates.io for the Vehicle Recalls Database API, and none is needed for the
  airports layer — the ArcGIS REST and OGC WMS interfaces are consumed with
  existing third-party clients (Esri JS API, GDAL/OGR, OWSLib, QGIS), which is
  the practical benefit of publishing to a standard rather than a bespoke shape.
