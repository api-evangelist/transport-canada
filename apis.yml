apis:
- aid: transport-canada:transport-canada-vehicle-recalls-database-api
  name: Transport Canada Vehicle Recalls Database API
  description: Transport Canada's only first-party public REST API. Returns safety-related
    recall records for vehicles, tires and child restraints recorded by the Defect
    Investigations and Recalls Division. The service root is self-describing — GET
    the application root and it returns the tables (recall, recall-summary) and the
    query parameters each accepts (recall-number, make-name, manufacturer-name, minimum-model-year,
    maximum-model-year, year-range, model-name) in both English and French. Path-segment
    query style, format=json or format=XML, no API key, no rate limit published. English
    and French service trees are mirrored at /eng/ and /fra/.
  humanURL: https://open.canada.ca/data/en/dataset/1ec92326-47ef-4110-b7ca-959fab03f96d
  baseURL: https://data.tc.gc.ca/v1.3/api/eng/vehicle-recall-database
  tags:
  - Recalls
  - Vehicle Safety
  - Road Transportation
  - Open Data
  properties:
  - type: Documentation
    url: https://open.canada.ca/data/en/dataset/1ec92326-47ef-4110-b7ca-959fab03f96d
  - type: APIReference
    url: https://data.tc.gc.ca/v1.3/api/eng/vehicle-recall-database/?format=json
  - type: ServiceDescriptor
    url: capabilities/transport-canada-vehicle-recalls-api-root.json
  - type: BulkDownload
