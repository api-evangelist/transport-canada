aid: transport-canada
url: https://raw.githubusercontent.com/api-evangelist/transport-canada/refs/heads/main/apis.yml
name: Transport Canada
kind: company
description: >-
  Transport Canada (Transports Canada) is the federal department that regulates
  aviation, marine, rail and road transportation in Canada under the Aeronautics Act
  and the Canadian Aviation Regulations. In travel it is the safety-and-security regulator
  rather than a participant in distribution — it certifies air operators, registers
  aircraft on the Canadian Civil Aircraft Register, licenses pilots and drone operators,
  runs the Civil Aviation Daily Occurrence Reporting System (CADORS) and the Air Cargo
  Security program, and publishes the Canadian airports layer. It sits entirely outside
  the GDS/NDC distribution chain; airline economic licensing, all-in fare advertising
  and the Air Passenger Protection Regulations belong to the separate Canadian Transportation
  Agency. Its API posture is thin but genuinely open — no developer portal exists at
  tc.canada.ca, developer./developers./docs. subdomains do not resolve, and no OpenAPI
  is published anywhere. What does exist is real and ungated: a self-describing JSON/XML
  Vehicle Recalls Database API at data.tc.gc.ca, an ArcGIS REST and OGC WMS service
  for Canadian airports with air navigation services, and bulk CSV/XML extracts of
  CADORS, the Air Cargo Security members list and the vessel registers, all indexed
  through the Treasury-Board-operated open.canada.ca CKAN Action API under the Open
  Government Licence – Canada. No key, no account, no accreditation, no contract.
