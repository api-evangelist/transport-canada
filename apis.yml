- aid: transport-canada:transport-canada-canadian-airports-arcgis-rest-api
  name: Transport Canada Canadian Airports ArcGIS REST API
  description: Queryable Esri ArcGIS REST MapServer (currentVersion 10.81) published
    by Transport Canada through the Government of Canada geospatial platform, covering
    Canadian airports served by NAV CANADA control towers or flight service stations.
    The layer 0 /query operation returns JSON features carrying TC_ID, IATA code, ICAO
    code, airport name, type (Control Tower / Flight Service Station), city, province,
    latitude and longitude. No key required. French service tree mirrored at the _fr
    path.
  humanURL: https://open.canada.ca/data/en/dataset/3a1eb6ef-6054-4f9d-b1f6-c30322cd7abf
  baseURL: https://maps-cartes.services.geo.ca/server_serveur/rest/services/TC/canadian_airports_w_air_navigation_services_en/MapServer
  tags:
