source: >-
  Live fetches of the /.well-known/ discovery surface on every host that appears
  in apis.yml (baseURL, humanURL, Website) plus the bulk and registry hosts,
  2026-07-28. Status is the HTTP code observed at fetch time.
finding: >-
  Transport Canada publishes NO /.well-known/ documents at all. Every path on
  every host returned 404. The one 200 in the set — www.canada.ca — is a soft
  404: the Government of Canada web platform answers unknown paths with HTTP 200
  and the "Not Found - Canada.ca" error page, canonicalised to
  https://www.canada.ca/errors/404.html. It is recorded as present-but-not-a-
  real-document and nothing was saved. No security.txt (RFC 9116), no
  api-catalog (RFC 9727), no OIDC or OAuth metadata, no ai-plugin manifest.
