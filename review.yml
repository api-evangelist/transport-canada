aid: transport-canada
name: Transport Canada
review:
  question: >-
    Does Transport Canada publish a public developer portal and machine-readable API
    contracts, and what would it cost a consumer of its data to leave?
  answer: partial
  date: '2026-07-28'
  reviewer: API Evangelist
  tier: regulator
  homeMarket: Canada
  primaryDomain: tc.canada.ca
findings:
  summary: >-
    Transport Canada has no developer portal, no OpenAPI, and no API key. It also has
    no meaningful lock-in. Three real, ungated machine-readable endpoints were confirmed
    live: a self-describing JSON/XML Vehicle Recalls Database API at data.tc.gc.ca,
    an Esri ArcGIS REST MapServer for Canadian airports with air navigation services,
    and an OGC WMS 1.3.0 service over the same layer. Everything else — CADORS civil
    aviation occurrences, the Air Cargo Security members list, the large-vessel and
    small-commercial-vessel registers, the National Collision Database — is published
    as bulk CSV/XML on opendatatc.tc.canada.ca and indexed through the Treasury Board
    Secretariat's CKAN Action API on open.canada.ca (49 datasets under org id "tc").
    The Canadian Civil Aircraft Register (CCARCS) is the one notable gap: a web search
    form capped at 1000 records with no API and no bulk download. Transport Canada is
    not part of the airline distribution chain at all; economic licensing of air
    carriers, all-in fare advertising and the Air Passenger Protection Regulations sit
    with the separate Canadian Transportation Agency.
  developerPortal:
    exists: false
    note: >-
      No portal at tc.canada.ca. Probed and recorded below. The Government of Canada
      API Store referenced by the tc-ca GitHub repo "API-Store-Policy-Scripts" no
      longer resolves (api.canada.ca returns no DNS answer).
  githubOrganization:
    url: https://github.com/tc-ca
    publicRepos: 69
    openapiFound: false
    note: >-
      GitHub code search across org:tc-ca for filename:openapi and filename:swagger
      both returned total_count 0 on 2026-07-28. Repos are internal line-of-business
      .NET/Angular projects (Seafarer Certification API, TSIS, PACE), not published
      API contracts.
